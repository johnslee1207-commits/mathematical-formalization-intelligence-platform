name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      - name: Run M0 deterministic acceptance
        shell: pwsh
        run: ./scripts/replay_m0.ps1 -EnvironmentProfilePath ./config/ci/m0_environment.json
      - name: Run M1 deterministic acceptance
        shell: pwsh
        run: ./scripts/replay_m1.ps1 -EnvironmentProfilePath ./config/ci/m0_environment.json
